function loc(val, lang) {
  if (val == null) return "";
  if (typeof val === "string") return val;
  if (typeof val === "object" && (val.es || val.en)) return val[lang] || val.es || val.en || "";
  return String(val);
}

function RotatedImage({ src, alt, loading }) {
  const wrapRef = useRef(null);
  const fit = (e) => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const cw = wrap.clientWidth;
    const ch = wrap.clientHeight;
    const img = e.target;
    // After rotate(-90deg): visual_width = css_height, visual_height = css_width
    // Set css dimensions so rotated image fills the container exactly
    img.style.width  = ch + 'px';
    img.style.height = cw + 'px';
    img.style.left   = (cw - ch) / 2 + 'px';
    img.style.top    = (ch - cw) / 2 + 'px';
  };
  return (
    <div ref={wrapRef} style={{width:"100%", height:"100%", position:"relative", overflow:"hidden"}}>
      <img src={src} alt={alt} loading={loading}
        style={{position:"absolute", transform:"rotate(-90deg)", transformOrigin:"center", maxWidth:"none"}}
        onLoad={fit}
      />
    </div>
  );
}

/* Unlock Web Audio on first user gesture anywhere on page */
const _audioUnlock = (() => {
  let unlocked = false;
  const unlock = () => {
    if (unlocked) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    unlocked = true;
    document.removeEventListener("mousemove", unlock, true);
    document.removeEventListener("click", unlock, true);
  };
  document.addEventListener("mousemove", unlock, true);
  document.addEventListener("click", unlock, true);
})();

function RepelText({ text, className, style }) {
  const containerRef = React.useRef(null);
  const lettersRef = React.useRef([]);
  const mousePos = React.useRef({ x: -9999, y: -9999 });
  const animFrame = React.useRef(null);
  const hasPlayed = React.useRef(false);
  const RADIUS = 120;
  const STRENGTH = 45;

  /* Pick ONE random sound for this page load */
  const chosenSound = React.useMemo(() => {
    const src = REPEL_SOUNDS[Math.floor(Math.random() * REPEL_SOUNDS.length)];
    const audio = new Audio(src);
    audio.volume = 0.55;
    audio.preload = "auto";
    return audio;
  }, []);

  React.useEffect(() => {
    const container = containerRef.current;
    if (!container) return;

    const animate = () => {
      const letters = lettersRef.current;
      let activeCount = 0;
      letters.forEach((el, i) => {
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = cx - mousePos.current.x;
        const dy = cy - mousePos.current.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < RADIUS) {
          activeCount++;
          const force = (1 - dist / RADIUS) * STRENGTH;
          const angle = Math.atan2(dy, dx);
          const tx = Math.cos(angle) * force;
          const ty = Math.sin(angle) * force;
          const rot = (Math.random() - 0.5) * force * 0.6;
          el.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
          el.style.transition = "transform 0.08s ease-out";
        } else {
          el.style.transform = "translate(0, 0) rotate(0deg)";
          el.style.transition = "transform 0.5s cubic-bezier(0.23, 1, 0.32, 1)";
        }
      });
      /* Play sound once on first hover that touches letters */
      if (activeCount > 0 && !hasPlayed.current) {
        hasPlayed.current = true;
        chosenSound.play().catch(() => {});
      }
      animFrame.current = requestAnimationFrame(animate);
    };

    const onMove = (e) => { mousePos.current = { x: e.clientX, y: e.clientY }; };
    const onLeave = () => { mousePos.current = { x: -9999, y: -9999 }; };

    container.addEventListener("mousemove", onMove);
    container.addEventListener("mouseleave", onLeave);
    animFrame.current = requestAnimationFrame(animate);

    return () => {
      container.removeEventListener("mousemove", onMove);
      container.removeEventListener("mouseleave", onLeave);
      cancelAnimationFrame(animFrame.current);
    };
  }, []);

  const chars = text.split("");
  return (
    <span ref={containerRef} className={className} style={{ ...style, display: "inline-block", cursor: "default" }}>
      {chars.map((ch, i) => (
        <span
          key={i}
          ref={(el) => (lettersRef.current[i] = el)}
          style={{ display: "inline-block", willChange: "transform" }}
        >
          {ch === " " ? " " : ch}
        </span>
      ))}
    </span>
  );
}

function ImageGrid({ images, lang }) {
  const sizeCls = (im) => {
    const base = im.size === "wide" ? "cell wide"
      : im.size === "sq"    ? "cell sq"
      : im.size === "third" ? "cell third"
      : im.size === "tall"  ? "cell tall"
      : "cell";
    const fit = im.fit ? " fit" : "";
    return (im.rotate ? base + " rotated" : base) + fit;
  };
  return (
    <div className="img-grid">
      {images.map((im, i) => (
        <div key={i} className={sizeCls(im)} style={im.rotate ? {aspectRatio:"2/3"} : undefined}>
          {im.src
            ? (im.rotate
                ? <RotatedImage src={im.src} alt="" loading="lazy" />
                : <img src={im.src} alt="" loading="lazy" />)
            : <Placeholder label={loc(im.placeholder, lang) || "IMAGEN PENDIENTE"} />
          }
          {im.cap && <span className="cap">{im.cap}</span>}
        </div>
      ))}
    </div>
  );
}

function TweaksPanel({ tweaks, setTweaks, t }) {
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === "__activate_edit_mode") setVisible(true);
      if (e.data.type === "__deactivate_edit_mode") setVisible(false);
    };
    window.addEventListener("message", onMsg);
    try { window.parent.postMessage({ type: "__edit_mode_available" }, "*"); } catch (e) {}
    return () => window.removeEventListener("message", onMsg);
  }, []);

  if (!visible) return null;

  const set = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    try { window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*"); } catch (e) {}
  };

  return (
    <aside className="tweaks">
      <header>
        <span>{t.tweak_header}</span>
        <button onClick={() => setVisible(false)} aria-label="close">×</button>
      </header>
      <div className="row">
        <span>{t.tweak_mode}</span>
        <div className="group">
          <button className={`chip ${tweaks.dark ? "" : "active"}`} onClick={() => set("dark", false)}>{t.tweak_light}</button>
          <button className={`chip ${tweaks.dark ? "active" : ""}`} onClick={() => set("dark", true)}>{t.tweak_dark}</button>
        </div>
      </div>
      <div className="row">
        <span>{t.tweak_images}</span>
        <div className="group">
          <button className={`chip ${tweaks.imgColor ? "" : "active"}`} onClick={() => set("imgColor", false)}>{t.tweak_bw}</button>
          <button className={`chip ${tweaks.imgColor ? "active" : ""}`} onClick={() => set("imgColor", true)}>{t.tweak_color}</button>
        </div>
      </div>
      <div className="row">
        <span>{t.tweak_type}</span>
        <div className="group">
          <button className={`chip ${tweaks.font === "archivo" ? "active" : ""}`} onClick={() => set("font", "archivo")}>{t.tweak_font_archivo}</button>
          <button className={`chip ${tweaks.font === "helv" ? "active" : ""}`} onClick={() => set("font", "helv")}>{t.tweak_font_helv}</button>
          <button className={`chip ${tweaks.font === "mono" ? "active" : ""}`} onClick={() => set("font", "mono")}>{t.tweak_font_mono}</button>
        </div>
      </div>
    </aside>
  );
}

              <div className="item" key={i}>
                <div className="when">{e.when} | {loc(e.what, lang)}</div>
                {e.body && <div className="what">{loc(e.body, lang)}</div>}
              </div>
            ))}
          </div>
        </div>

        <div className="right">
          <div className="block">
            <h3>{t.cv_h_profile}</h3>
            <p style={{ maxWidth: "58ch" }}>{loc(d.intro, lang)}</p>
          </div>
          <div className="block">
            <h3>{t.cv_h_experience}</h3>
            {d.experience.map((e, i) => (
              <div className="item" key={i}>
                <div className="when">{e.when} | {loc(e.what, lang)}</div>
                <div className="what">{loc(e.body, lang)}</div>
              </div>
            ))}
          </div>
        </div>
      </section>
    </main>
  );
}

/* ── LOOK PAGE ──────────────────────────────────────────────────────── */
function LookPage({ projectId, lookId, lang, setRoute, t }) {
  const p = PROJECTS.find(pr => pr.id === projectId);
  if (!p || !p.looks) return <main style={{ padding: 40 }}>Not found.</main>;
  const look = p.looks.find(l => l.id === lookId);
  if (!look) return <main style={{ padding: 40 }}>Look not found.</main>;

  const prevLook = p.looks.find(l => l.id === lookId - 1);
  const nextLook = p.looks.find(l => l.id === lookId + 1);

  return (
    <main>
      <div style={{ padding: "10px 0" }}>
        <a className="back" href={`#/p/${p.id}`} onClick={(e) => { e.preventDefault(); setRoute({ name: "project", id: p.id }); }}>
          {lang === "en" ? "Back to" : "Volver a"} {lang === "en" ? p.titleEn : p.title}
        </a>
      </div>

      <section className="prj-header">
        <div className="left">
          <div className="prj-kicker">{p.n} / {lang === "en" ? p.titleEn : p.title} · {p.year}</div>
          <h1 className="prj-title">{loc(look.name, lang)}</h1>
        </div>
        <div className="right" style={{ display: "flex", alignItems: "center" }}>
          <p style={{ maxWidth: "48ch", fontSize: 15 }}>{loc(look.desc, lang)}</p>
        </div>
      </section>

      <section className="prj-section">
        <div className="label">{lang === "es" ? "Fotografía del look" : "Look photography"}</div>
        <ImageGrid images={look.images} lang={lang} />
      </section>

      <section className="prj-end">
        {prevLook ? (
          <a className="side" href={`#/p/${p.id}/look/${prevLook.id}`} onClick={(e) => { e.preventDefault(); setRoute({ name: "look", id: p.id, lookId: prevLook.id }); }}>
            <span className="mono">← {t.prev_project}</span>
            <span className="big">{loc(prevLook.name, lang)}</span>
          </a>
        ) : (
          <a className="side" href={`#/p/${p.id}`} onClick={(e) => { e.preventDefault(); setRoute({ name: "project", id: p.id }); }}>
            <span className="mono">← {lang === "en" ? "Back to project" : "Volver al proyecto"}</span>
            <span className="big">{lang === "en" ? p.titleEn : p.title}</span>
          </a>
        )}
        {nextLook ? (
          <a className="side" href={`#/p/${p.id}/look/${nextLook.id}`} onClick={(e) => { e.preventDefault(); setRoute({ name: "look", id: p.id, lookId: nextLook.id }); }}>
            <span className="mono">{t.next_project} →</span>
            <span className="big">{loc(nextLook.name, lang)}</span>
          </a>
        ) : (
          <a className="side" href={`#/p/${p.id}`} onClick={(e) => { e.preventDefault(); setRoute({ name: "project", id: p.id }); }}>
            <span className="mono">{lang === "en" ? "Back to project" : "Volver al proyecto"} →</span>
            <span className="big">{lang === "en" ? p.titleEn : p.title}</span>
          </a>
        )}
      </section>
    </main>
  );
}

/* ── APP ─────────────────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = { dark: false, imgColor: false, font: "archivo" };

function parseHash() {
  const h = (location.hash || "").replace(/^#\/?/, "");
  if (!h || h === "") return { name: "home" };
  if (h === "cv") return { name: "cv" };
  const lm = h.match(/^p\/(.+)\/look\/(\d+)$/);
  if (lm) return { name: "look", id: lm[1], lookId: parseInt(lm[2]) };
  const m = h.match(/^p\/(.+)$/);
  if (m) return { name: "project", id: m[1] };
  return { name: "home" };
}

function App() {
  const [route, _setRoute] = useState(parseHash());
  const [lang, setLang] = useState(() => {
    const s = localStorage.getItem("portfolio.lang");
    return s === "en" || s === "es" ? s : "es";
  });
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  const setRoute = (r) => {
    _setRoute(r);
    if (r.name === "home") location.hash = "#/";
    else if (r.name === "cv") location.hash = "#/cv";
    else if (r.name === "project") location.hash = `#/p/${r.id}`;
    else if (r.name === "look") location.hash = `#/p/${r.id}/look/${r.lookId}`;
    window.scrollTo({ top: 0, behavior: "instant" });
  };

  useEffect(() => {
    const onHash = () => _setRoute(parseHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    localStorage.setItem("portfolio.lang", lang);
    document.documentElement.lang = lang;
  }, [lang]);

  useEffect(() => {
    const root = document.documentElement;
    root.classList.toggle("dark", !!tweaks.dark);
    document.body.classList.toggle("img-color", !!tweaks.imgColor);
    const fm = {
      archivo: { display: '"Archivo","Helvetica Neue",sans-serif', narrow: '"Archivo Narrow","Archivo",sans-serif', body: '"Archivo",sans-serif' },
      helv:    { display: '"Helvetica Neue",Helvetica,Arial,sans-serif', narrow: '"Helvetica Neue Condensed","Helvetica Neue",sans-serif', body: '"Helvetica Neue",Helvetica,Arial,sans-serif' },
      mono:    { display: '"JetBrains Mono",ui-monospace,monospace', narrow: '"JetBrains Mono",ui-monospace,monospace', body: '"JetBrains Mono",ui-monospace,monospace' }
    }[tweaks.font] || {};
    if (fm.display) {
      root.style.setProperty("--font-display", fm.display);
      root.style.setProperty("--font-narrow", fm.narrow);
      root.style.setProperty("--font-body", fm.body);
    }
  }, [tweaks]);

  const t = I18N[lang];

  let view;
  if (route.name === "home") view = <Home lang={lang} setRoute={setRoute} t={t} />;
  else if (route.name === "cv") view = <CvPage lang={lang} t={t} />;
  else if (route.name === "look") view = <LookPage projectId={route.id} lookId={route.lookId} lang={lang} setRoute={setRoute} t={t} />;
  else if (route.name === "project") view = <ProjectPage id={route.id} lang={lang} setRoute={setRoute} t={t} />;

  return (
    <>
      <GridLines />
      <div className="page" data-screen-label={route.name === "project" ? `Project ${route.id}` : route.name}>
        <TopBar route={route} setRoute={setRoute} lang={lang} setLang={setLang} t={t} />
        {view}
      </div>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} t={t} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
