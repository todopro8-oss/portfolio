# Build de la web en cada push. El despliegue a GitHub Pages solo ocurre desde main y cuando Diego
# haya cambiado en Settings → Pages la fuente a «GitHub Actions» (DECISIONES D10).
name: Web

on:
  push:
    branches: [main, bar]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v6
        with:
          node-version: 22

  desplegar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [pruebas, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
